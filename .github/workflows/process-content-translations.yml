name: Process Content Translations

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale code configured in content_locales"
        required: true
        default: "es"
      limit:
        description: "Maximum queued roots to process"
        required: true
        default: "25"
      auto_publish:
        description: "Publish completed translations and localized render caches"
        type: boolean
        required: true
        default: true

concurrency:
  group: content-translations-${{ inputs.locale || 'es' }}
  cancel-in-progress: false

jobs:
  process:
    name: Translate queued content
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL }}
      TARGET_LOCALE: ${{ inputs.locale || 'es' }}
      TRANSLATION_LIMIT: ${{ inputs.limit || '25' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL OPENAI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

      - name: Process translation queue
        shell: bash
        run: |
          set -euo pipefail
          args=(--locale "$TARGET_LOCALE" --limit "$TRANSLATION_LIMIT")
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto_publish }}" = "true" ]; then
            args+=(--auto-publish)
          fi
          npm run translate:process -- "${args[@]}"

      - name: Report publication readiness
        if: always()
        continue-on-error: true
        run: npm run verify:translations -- --locale "$TARGET_LOCALE"
