name: Verify Content Translations

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale code configured in content_locales"
        required: true
        default: "es"

concurrency:
  group: verify-content-translations-${{ inputs.locale }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify localized content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_LOCALE: ${{ inputs.locale }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate database secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing required GitHub secret: SUPABASE_DB_URL"
            exit 1
          fi

      - name: Report publication readiness
        run: npm run verify:translations -- --locale "$TARGET_LOCALE"
